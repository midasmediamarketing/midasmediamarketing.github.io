<style>
:root{--ink:#111111;--ink2:#1C1C1A;--line-d:#2F2E2B;--line-d2:#3A3936;--paper:#FFFFFF;--sand:#F4F2EE;--line:#D9D6CF;--text2:#45433F;--mute-d:#D9D6CF;--mute-d2:#BDB9B0;--gold:#E2B33C;--gold-ink:#6B5A1E}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55}
h1,h2,h3,h4,.display{font-family:"Space Grotesk",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.sec{padding:104px 0}
.dark{background:var(--ink);color:#fff}
.sand{background:var(--sand)}
.eyebrow{margin:0;font-size:14px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-ink)}
.dark .eyebrow{color:var(--gold)}
.h2{margin:0;font-weight:700;font-size:clamp(32px,4vw,48px);line-height:1.1;letter-spacing:-1px}
.lead{margin:0;font-size:18px;color:var(--text2)}
.dark .lead{color:var(--mute-d)}
.head{display:flex;flex-direction:column;gap:14px;max-width:720px;margin-bottom:48px}
.gold{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.grid-300{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:999px;text-decoration:none;font-weight:600;font-size:17px;border:0;cursor:pointer;font-family:inherit;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease,border-color .18s ease,color .18s ease}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:transparent;color:#fff;border:1px solid #5a5853}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(226,179,60,.38);filter:brightness(1.07)}
.btn:active{transform:none;box-shadow:none}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(226,179,60,.15)}
.card{transition:transform .22s ease,box-shadow .22s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(17,17,17,.14)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;border:1px solid #5a5853;color:var(--mute-d2);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
/* header */
.site-header{background:var(--ink);border-bottom:1px solid #2a2a28;position:relative;z-index:40}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.logo-mark{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:-.5px}
.logo-text{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;font-size:18px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.nav-link,.dd-btn{color:var(--mute-d);text-decoration:none;font-size:15px;transition:color .15s ease}
.nav-link:hover,.dd-btn:hover,.dd.open>.dd-btn{color:var(--gold)}
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border:0;background:transparent;cursor:pointer;font-family:inherit;font-weight:600;font-size:14px;color:#fff}
.menu-wrap{position:absolute;top:100%;left:0;padding-top:8px;display:none;z-index:30}
.dd-right .menu-wrap{left:auto;right:0}
.dd.open>.menu-wrap{display:block}
@media (hover:hover){.dd:hover>.menu-wrap{display:block}}
.menu{min-width:200px;padding:6px;border-radius:14px;background:var(--ink2);border:1px solid var(--line-d2);box-shadow:0 12px 32px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:2px}
.menu-item{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:#fff;cursor:pointer;text-align:left;font-family:inherit;font-size:15px;font-weight:500;text-decoration:none;transition:background-color .15s ease,color .15s ease}
.menu-item:hover{background:#2A2A28;color:var(--gold)}
.menu-item.is-on{background:#2A2A28;color:var(--gold);font-weight:600}
.menu-item small{font-size:13px;color:var(--mute-d2)}
.dd-sub{position:relative}
.sub-wrap{position:absolute;top:-6px;left:100%;padding-left:8px;display:none;z-index:31}
.dd-sub.open>.sub-wrap{display:block}
@media (hover:hover){.dd-sub:hover>.sub-wrap{display:block}}
.sub-wrap .menu{min-width:230px}
.sub-name{display:inline-flex;align-items:center;gap:10px;font-weight:600}
@media (max-width:720px){.sub-wrap{position:static;padding-left:0;margin-top:4px}}
/* hero */
.hero{padding:96px 0 104px}
.hero{overflow:hidden}.hero-in{display:flex;flex-wrap:wrap;align-items:center;gap:48px}.hero-text{flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:28px}.hero-art{flex:1 1 420px;min-width:0;display:flex;justify-content:center}.hero-svg{width:100%;max-width:620px;height:auto}
.hero h1{margin:0;font-weight:700;font-size:clamp(44px,6vw,76px);line-height:1.02;letter-spacing:-2px}
.hero .eyebrow{color:var(--gold)}
.hero-sub{margin:0;max-width:660px;font-size:20px;color:var(--mute-d)}
.row{display:flex;flex-wrap:wrap;gap:14px}
.soon-note{align-self:flex-start;display:inline-flex;align-items:center;flex-wrap:wrap;gap:10px 12px;max-width:100%;padding:10px 16px 10px 10px;border:1px solid #3A3936;border-radius:16px;background:#1C1C1A;color:var(--mute-d);font-size:15px;line-height:1.4}
.soon-tag{flex:none;padding:4px 10px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.trust{display:flex;flex-wrap:wrap;gap:12px 32px;margin-top:16px;font-size:15px;color:var(--mute-d2)}
/* cards */
.svc{padding:28px;border-radius:16px;background:var(--sand);display:flex;flex-direction:column;gap:12px}
.svc .n{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:15px;color:var(--gold-ink)}
.svc h3{margin:0;font-size:22px;font-weight:600}
.svc p,.step p{margin:0;color:var(--text2)}
.why{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.why h2{margin:0;font-weight:700;font-size:clamp(34px,5vw,56px);line-height:1.08;letter-spacing:-1.5px}
.why p{margin:0;font-size:20px;line-height:1.6;color:#2E2D2A}
.why p.strong{font-weight:600;color:var(--ink)}
.why p.why-cta{margin-top:16px;font-family:"Space Grotesk",system-ui,sans-serif;font-size:clamp(26px,3.2vw,34px);font-weight:700;line-height:1.15;letter-spacing:-.5px;color:var(--ink)}
.contact-compact{padding:48px 0}
.ai-eyebrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:start}
.ai-sub{margin:0 0 20px;font-size:22px;font-weight:700;letter-spacing:-.3px}
.ai-why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:22px}
.ai-why-item{display:flex;gap:16px;align-items:flex-start}
.ai-num{flex:none;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:15px;color:var(--gold-ink);padding-top:3px}
.ai-why-item h4{margin:0 0 4px;font-size:19px;font-weight:600}
.ai-why-item p,.ai-card p{margin:0;color:var(--text2)}
.ai-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ai-card{padding:20px;border-radius:14px;background:var(--sand);display:flex;flex-direction:column;gap:6px}
.ai-card h4{margin:0;font-size:17px;font-weight:600}
.ai-cta{margin-top:48px}
.contact-compact .contact-direct{margin-top:0;padding-top:0;border-top:0}
.step{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:2px solid var(--ink)}
.step h3{margin:0;font-size:21px;font-weight:600}
/* platforms */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
.tab{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;border:1px solid var(--line-d2);background:transparent;color:#fff;transition:border-color .18s ease,color .18s ease}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.net-head{display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--line-d);margin-bottom:24px}
.net-head h2{margin:0;font-size:34px;font-weight:700;letter-spacing:-.5px;color:var(--gold);display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap}
.net-head p{margin:0;font-size:17px;color:var(--mute-d)}
.pf{padding:28px;border-radius:16px;background:var(--ink2);border:1px solid var(--line-d);display:flex;flex-direction:column;gap:12px;scroll-margin-top:24px}
.pf h3{margin:0;font-size:22px;font-weight:600}
.pf .where{margin:0;font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--gold)}
.pf p{margin:0;color:var(--mute-d)}
/* pricing */
.price-card{padding:36px;border-radius:20px;border:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.price-card.dark{border-color:var(--ink)}
.price-card h3{margin:0;font-size:22px;font-weight:600}
.pill{align-self:flex-start;padding:4px 10px;border-radius:999px;background:#FBF3DC;color:var(--gold-ink);font-size:12px;font-weight:600;letter-spacing:.4px}
.dark .pill{background:#2A2A28;color:var(--gold)}
.price-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px}
.old{font-family:"Space Grotesk",system-ui,sans-serif;font-size:24px;font-weight:600;color:#75726B;text-decoration:line-through}
.dark .old{color:#9A978F}
.price{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;font-size:44px;font-weight:700;letter-spacing:-1px}
.price-card p.desc{margin:0;color:var(--text2)}
.price-card.dark p.desc{color:var(--mute-d)}
.note{margin:24px 0;max-width:860px;font-size:16px;color:var(--text2)}
.offer{padding:28px 32px;border-radius:20px;background:var(--sand);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.offer h3{margin:0 0 6px;font-size:21px;font-weight:600}
.offer p{margin:0;color:var(--text2);max-width:760px}
.addons{margin-top:56px;display:flex;flex-direction:column;gap:20px}
.addons h3.t{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px}
.addon{padding:24px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.addon h4{margin:0;font-size:20px;font-weight:600}
.addon .p{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;font-size:26px;font-weight:700;letter-spacing:-.5px;color:var(--gold-ink)}
.addon p{margin:0;color:var(--text2)}
.faq{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px 48px}
.faq h3{margin:0 0 8px;font-family:Inter,system-ui,sans-serif;font-size:18px;font-weight:600}
.faq p{margin:0;color:var(--text2)}
/* careers */
.role{padding:28px;border-radius:16px;background:#fff;border:1px solid #E4E1DA;display:flex;flex-direction:column;gap:12px}
.role .tag{align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--sand);color:var(--gold-ink);font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.role h3{margin:0;font-size:22px;font-weight:600}
.role p{margin:0;color:var(--text2)}
.apply{margin-top:48px;padding:28px 32px;border-radius:20px;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.apply p{margin:0;max-width:680px;font-size:18px;color:var(--mute-d)}
/* contact/footer */
.contact-in{display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.contact h2{margin:0;max-width:860px;font-weight:700;font-size:clamp(36px,5vw,64px);line-height:1.05;letter-spacing:-1.5px}
.contact p{margin:0;max-width:640px;font-size:19px;color:var(--mute-d)}
.contact .small{font-size:15px;color:var(--mute-d2)}
.contact-direct{display:flex;flex-direction:column;gap:14px;margin-top:8px;padding-top:28px;border-top:1px solid #2a2a28;width:100%}
.contact-links{display:flex;flex-wrap:wrap;gap:12px}
.btn-contact{gap:10px;min-height:52px;padding:0 22px;background:#1C1C1A;color:#fff;border:1px solid #3A3936}
.btn-contact:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(226,179,60,.15)}
.site-footer{background:var(--ink);border-top:1px solid #2a2a28;padding:28px 0;font-size:14px;color:var(--mute-d2)}
.site-footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
@media (max-width:720px){.sec{padding:72px 0}.hero{padding:72px 0 80px}.price{font-size:36px}}
.qz-root[hidden]{display:none}
.qz-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.qz-backdrop{position:absolute;inset:0;background:rgba(17,17,17,.62)}
.qz{position:relative;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;color:var(--ink);border-radius:20px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.qz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.qz-step{font-size:14px;font-weight:600;color:var(--gold-ink)}
.qz-x{width:44px;height:44px;border:0;border-radius:999px;background:transparent;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.qz-x:hover{background:var(--sand)}
.qz-bar{height:6px;border-radius:999px;background:var(--sand);overflow:hidden;margin-bottom:24px}
.qz-bar span{display:block;height:100%;background:var(--gold);transition:width .25s ease}
.qz h2{margin:0 0 20px;font-size:26px;line-height:1.2;letter-spacing:-.5px}
.qz-opts{display:flex;flex-direction:column;gap:10px}
.qz-opt{display:flex;align-items:center;width:100%;min-height:52px;padding:0 18px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);transition:border-color .15s ease,background-color .15s ease}
.qz-opt:hover{border-color:var(--gold)}
.qz-opt[aria-pressed="true"]{border-color:var(--gold);background:#FBF3DC;font-weight:600}
.qz-form{display:flex;flex-direction:column;gap:14px}
.qz-form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.qz-form input{min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;color:var(--ink)}
.qz-form input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.qz-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.qz-msg{margin:0;font-size:15px;color:#9A2E1F}
.qz-msg a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.qz-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.qz-back{min-height:44px;padding:0 6px;border:0;background:transparent;cursor:pointer;font:inherit;font-weight:600;color:var(--text2)}
.qz-back:hover{color:var(--ink)}
.qz-done p{margin:0 0 24px;font-size:17px;color:var(--text2)}
@media (max-width:560px){.qz-root{align-items:flex-end;padding:0}.qz{border-radius:20px 20px 0 0;max-height:92vh;padding:22px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.card,.tab,.menu-item,.nav-link{transition:none}.btn:hover,.card:hover{transform:none}}
</style>
</head>

  var qz = { open: false, step: 0, answers: [], form: { name: '', site: '', contact: '', website: '' }, status: '', lastFocus: null };
  var qroot = document.getElementById('quiz');
  var XICON = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function quizMsg(msg, Q) {
    if (msg.indexOf('{link}') < 0) return esc(msg);
    var parts = msg.split('{link}');
    return esc(parts[0]) + '<a href="mailto:' + esc(CONTACT.email) + '?subject=' + encodeURIComponent('Free ad audit request') + '">' + esc(Q.errorLink) + '</a>' + esc(parts[1]);
  }
  function renderQuiz() {
    if (!qz.open) { qroot.hidden = true; qroot.innerHTML = ''; return; }
    var Q = QUIZ[lang] || QUIZ.en;
    var total = Q.q.length + 1;
    var body;
    if (qz.status === 'done') {
      body = '<div class="qz-done"><h2 id="qz-title">' + esc(Q.doneTitle) + '</h2><p>' + esc(Q.doneText) + '</p><button type="button" class="btn btn-dark" data-qz-close>' + esc(Q.close) + '</button></div>';
    } else {
      var n = qz.step + 1;
      var head = '<div class="qz-top"><span class="qz-step">' + esc(Q.step.replace('{n}', n).replace('{t}', total)) + '</span><button type="button" class="qz-x" data-qz-close aria-label="' + esc(Q.close) + '">' + XICON + '</button></div>' +
        '<div class="qz-bar" aria-hidden="true"><span style="width:' + Math.round(n / total * 100) + '%"></span></div>';
      var main;
      if (qz.step < Q.q.length) {
        var item = Q.q[qz.step];
        main = '<h2 id="qz-title">' + esc(item[0]) + '</h2><div class="qz-opts">' + item[1].map(function (o, i) {
          return '<button type="button" class="qz-opt" data-qz-opt="' + i + '" aria-pressed="' + (qz.answers[qz.step] === i) + '">' + esc(o) + '</button>';
        }).join('') + '</div>';
      } else {
        var sending = qz.status === 'sending';
        var msg = qz.status === 'required' ? Q.required : qz.status === 'error' ? Q.error : '';
        main = '<h2 id="qz-title">' + esc(Q.formTitle) + '</h2><form class="qz-form" novalidate>' +
          '<label>' + esc(Q.name) + '<input name="name" autocomplete="name" maxlength="120" value="' + esc(qz.form.name) + '" required></label>' +
          '<label>' + esc(Q.site) + '<input name="site" autocomplete="url" maxlength="200" value="' + esc(qz.form.site) + '"></label>' +
          '<label>' + esc(Q.contact) + '<input name="contact" autocomplete="email" maxlength="160" value="' + esc(qz.form.contact) + '" required></label>' +
          '<div class="qz-hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off" value=""></div>' +
          (msg ? '<p class="qz-msg" role="alert">' + quizMsg(msg, Q) + '</p>' : '') +
          '<button type="submit" class="btn btn-gold"' + (sending ? ' disabled' : '') + '>' + esc(sending ? Q.sending : Q.submit) + '</button>' +
          '</form>';
      }
      var foot = qz.step > 0 ? '<div class="qz-foot"><button type="button" class="qz-back" data-qz-back>← ' + esc(Q.back) + '</button></div>' : '';
      body = head + main + foot;
    }
    qroot.innerHTML = '<div class="qz-backdrop" data-qz-close></div><div class="qz" role="dialog" aria-modal="true" aria-labelledby="qz-title">' + body + '</div>';
    qroot.hidden = false;
    var first = qroot.querySelector('.qz-opt[aria-pressed="true"]') || qroot.querySelector('.qz-opt, .qz-form input, .qz-done .btn');
    if (first && qz.status !== 'sending') first.focus();
  }
  function openQuiz() {
    qz.open = true; qz.step = 0; qz.answers = []; qz.status = ''; qz.form = { name: '', site: '', contact: '', website: '' };
    qz.lastFocus = document.activeElement;
    document.body.style.overflow = 'hidden';
    renderQuiz();
  }
  function closeQuiz() {
    qz.open = false; document.body.style.overflow = '';
    renderQuiz();
    if (qz.lastFocus && qz.lastFocus.focus) qz.lastFocus.focus();
  }
  function submitQuiz() {
    var f = qz.form;
    if (!f.name.trim() || !f.contact.trim()) { qz.status = 'required'; renderQuiz(); return; }
    if (f.website) { qz.status = 'done'; renderQuiz(); return; }
    var R = QUIZ.ru.q;
    var payload = {
      lang: LANG_NAMES[lang] || lang,
      business: R[0][1][qz.answers[0]] || '',
      goal: R[1][1][qz.answers[1]] || '',
      budget: R[2][1][qz.answers[2]] || '',
      current: R[3][1][qz.answers[3]] || '',
      name: f.name.trim(), site: f.site.trim(), contact: f.contact.trim(), website: f.website
    };
    qz.status = 'sending'; renderQuiz();
    fetch(QUIZ_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); qz.status = 'done'; renderQuiz(); })
      .catch(function () { qz.status = 'error'; renderQuiz(); });
  }
  qroot.addEventListener('click', function (e) {
    var el;
    if ((el = e.target.closest('[data-qz-close]'))) { closeQuiz(); return; }
    if ((el = e.target.closest('[data-qz-back]'))) { qz.step = Math.max(0, qz.step - 1); qz.status = ''; renderQuiz(); return; }
    if ((el = e.target.closest('[data-qz-opt]'))) { qz.answers[qz.step] = +el.getAttribute('data-qz-opt'); qz.step += 1; renderQuiz(); return; }
  });
  qroot.addEventListener('input', function (e) { if (e.target.name && e.target.name in qz.form) qz.form[e.target.name] = e.target.value; });
  qroot.addEventListener('submit', function (e) { e.preventDefault(); submitQuiz(); });
  document.addEventListener('keydown', function (e) {
    if (!qz.open) return;
    if (e.key === 'Escape') { closeQuiz(); return; }
    if (e.key === 'Tab') {
      var f = qroot.querySelectorAll('button:not([disabled]), input:not([tabindex="-1"])');
      if (!f.length) return;
      var a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    }
  });

  document.addEventListener('click', function (e) {
    var el;
    if (e.target.closest('#quiz')) return;
    if ((el = e.target.closest('[data-quiz]'))) { e.preventDefault(); closeMenus(); openQuiz(); return; }
    if ((el = e.target.closest('[data-lang]'))) {
      lang = el.getAttribute('data-lang');
      try { localStorage.setItem(STORE, lang); } catch (err) {}
      render(); return;
    }
    if ((el = e.target.closest('[data-go]'))) {
      e.preventDefault();
      var page = el.getAttribute('data-go');
      var net = el.getAttribute('data-net');
      pendingAnchor = el.getAttribute('data-anchor');
      var h = page === 'home' ? '#/' : page === 'platforms' ? '#/platforms/' + (net || 'meta') : '#/' + page;
      if (location.hash === h || (h === '#/' && (location.hash === '' || location.hash === '#'))) render();
      else location.hash = h;
      return;
    }
    if ((el = e.target.closest('[data-scroll]'))) {
      e.preventDefault();
      var target = document.getElementById(el.getAttribute('data-scroll'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if ((el = e.target.closest('[data-tab]'))) {
      location.hash = '#/platforms/' + el.getAttribute('data-tab'); return;
    }
    if ((el = e.target.closest('.sub-btn'))) {
      var sub = el.parentNode, wasOpen = sub.classList.contains('open');
      sub.parentNode.querySelectorAll('.dd-sub.open').forEach(function (s) { s.classList.remove('open'); });
      if (!wasOpen) sub.classList.add('open');
      return;
    }
    if ((el = e.target.closest('.dd-btn'))) {
      var dd = el.parentNode, open = dd.classList.contains('open');
      closeMenus();
      if (!open) { dd.classList.add('open'); el.setAttribute('aria-expanded', 'true'); }
      return;
    }
    if (!e.target.closest('.dd')) closeMenus();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenus(); });
  window.addEventListener('hashchange', render);
  render();
})();

</script>
</body>
</html>
